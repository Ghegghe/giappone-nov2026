<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Conto rimborsi</title>
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" id="theme-css" href="assets/css/themes/neutral.css">
<script src="assets/js/theme-boot.js"></script>
<style>
/* Pagina a sé (senza nav): riepilogo spese anticipate in stile fattura, dati da budget.json › advanced (assets/js/conto.js) */
.conto{max-width:1040px;margin:0 auto;padding-block:24px;display:grid;gap:20px}
.conto .doc{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);padding:20px;display:grid;gap:20px}
.conto .top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;align-items:flex-start}
.conto h1{margin:0}
.conto .meta{display:grid;grid-template-columns:auto auto;gap:2px 14px;font-size:.88rem;margin:0}
.conto .meta dt{color:var(--fg-muted)} .conto .meta dd{margin:0;font-family:var(--font-mono)}
.conto .wrap{overflow-x:auto}
.conto table{width:100%;border-collapse:collapse;min-width:640px}
.conto th{text-align:left;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-muted);padding:8px 10px;border-bottom:1px solid var(--border)}
.conto td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top}
.conto .n{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.conto .sec td{font-weight:600;padding-top:14px;border-bottom:1px solid var(--fg)}
.conto .sub td{color:var(--fg-muted);font-weight:600}
.conto .tot td{font-weight:600;border-top:2px solid var(--fg);border-bottom:0;font-size:1rem}
.conto .pp{color:var(--accent)}
.conto .foot{font-size:.8rem;color:var(--fg-muted);margin:0}
.conto .back{display:inline-flex;align-items:center;min-height:44px}
</style>
</head>
<body>
<main class="container conto" data-page="conto">
  <a class="back small" href="budget.html">← Budget</a>
<div class="doc" data-conto aria-live="polite"><p class="muted">Caricamento…</p></div>
</main>
<script type="module" src="assets/js/conto.js"></script>
</body>
</html>
