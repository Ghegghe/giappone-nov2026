<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test pagine contenuto</title>
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" id="theme-css" href="../assets/css/themes/neutral.css">
<link rel="stylesheet" href="../assets/css/pages.css">
<script>
  // Niente auto-boot di pages.js: qui i moduli vengono renderizzati a mano nei contenitori.
  window.__PAGES_NO_BOOT__ = true;
  // ?stub=1 → usa dev/app.stub.pages.js al posto del vero app.js (import map iniettato prima di ogni module).
  if (new URLSearchParams(location.search).has('stub')) {
    const s = document.createElement('script');
    s.type = 'importmap';
    s.textContent = JSON.stringify({ imports: { [new URL('../assets/js/app.js', location.href).href]: new URL('./app.stub.pages.js', location.href).href } });
    document.currentScript.after(s);
  }
</script>
<style>
  .t-ok { color: var(--ok); } .t-ko { color: var(--danger); font-weight: 700; }
  .t-box { border: 1px dashed var(--border); padding: var(--space-3); margin-block: var(--space-4); }
</style>
</head>
<body>
<main class="container stack">
  <h1 class="h1">Test pagine contenuto</h1>
  <p class="small muted">Apri con <code>?data=dev/fixtures/</code> (default) · <code>&amp;stub=1</code> per lo stub di app.js · <code>&amp;show=1</code> per vedere i render.</p>
  <ol id="results" class="stack small"></ol>
  <div id="boxes"></div>
</main>
<script type="module">
  // il vero app.js risolve ?data= rispetto alla radice del sito: default alle fixture
  if (!new URLSearchParams(location.search).has('data')) {
    const u = new URL(location.href); u.searchParams.set('data', 'dev/fixtures/'); location.replace(u.href);
  }
  history.replaceState(null, '', location.pathname + location.search); // i tab scrivono l'hash
  const app = await import('../assets/js/app.js');
  const { html, mount, safeUrl } = await import('../assets/js/pages.js');
  const home = await import('../assets/js/pages-home.js');
  const tr = await import('../assets/js/pages-trasporti.js');
  const al = await import('../assets/js/pages-alloggi.js');
  const lu = await import('../assets/js/pages-luoghi.js');
  const bu = await import('../assets/js/pages-budget.js');

  const out = document.getElementById('results');
  let fails = 0;
  const ok = (cond, msg) => {
    const li = document.createElement('li');
    li.className = cond ? 't-ok' : 't-ko';
    li.textContent = (cond ? 'OK  ' : 'KO  ') + msg;
    out.append(li); if (!cond) { fails++; console.error('KO', msg); }
  };
  const box = (name) => {
    const d = document.createElement('section'); d.className = 't-box stack'; d.dataset.name = name;
    if (!new URLSearchParams(location.search).has('show')) d.hidden = true;
    document.getElementById('boxes').append(d); return d;
  };
  const trip = await app.loadData('trip');
  const ctx = { trip, loadData: app.loadData };

  // --- helper sicurezza ---
  const x = document.createElement('div');
  mount(x, html`<p title="${'"><img src=x onerror=alert(1)>'}">${'<script>alert(1)<\/script>'}</p>`);
  ok(!x.querySelector('img,script') && x.textContent.includes('<script>'), 'html`` escapa testo e attributi');
  ok(safeUrl('javascript:alert(1)') === '' && safeUrl('smart-ex.jp/en') === 'https://smart-ex.jp/en', 'safeUrl blocca javascript: e completa i domini');

  // --- home ---
  ok(home.tripStatus(trip, '2026-10-01').days === 37, 'countdown 1 ott → 37 giorni');
  const s2 = home.tripStatus(trip, '2026-11-12');
  ok(s2.phase === 'during' && s2.dayN === 6 && s2.total === 18, 'in viaggio 12 nov → giorno 6 di 18');
  ok(home.tripStatus(trip, '2026-11-25').phase === 'after', 'dopo il 24 nov → concluso');
  const bh = box('home'); await home.render(bh, ctx);
  ok(/tra \d+ giorni|si parte|giorno \d+ di|concluso/.test(bh.querySelector('.home-head__line')?.textContent || ''), 'home: una riga con date, persone e quanto manca');
  ok(home.tripLine(trip, home.tripStatus(trip, '2026-10-02')) === 'sab 7 → mar 24 nov · 4 persone · tra 36 giorni', 'home: riga «sab 7 → mar 24 nov · 4 persone · tra 36 giorni»');
  ok(bh.querySelectorAll('.home-day__item').length >= 1 && !bh.querySelector('.card'), 'home: «Prossimo giorno» come lista semplice, senza card');
  ok(bh.querySelectorAll('.home-dl').length === 3, 'home: le 3 scadenze più vicine');
  // scadenze: "in ritardo" solo se la data (fine intervallo inclusa) è passata, in fuso italiano
  const { deadlineState, deadlineLabel } = await import('../assets/js/pages.js');
  ok(deadlineState({ status: 'todo', sortDate: '2026-10-01' }, '2026-10-01') === 'today', 'scadenza con data di oggi → "oggi", non in ritardo');
  ok(deadlineState({ status: 'todo', sortDate: '2026-10-01', endDate: '2026-10-02' }, '2026-10-02') === 'today', 'intervallo 1-2 ott il 2 ott → ancora "oggi"');
  ok(deadlineState({ status: 'todo', sortDate: '2026-09-30' }, '2026-10-01') === 'late', 'data passata → in ritardo');
  ok(deadlineLabel({ sortDate: '2026-10-11', when: '11 ott 3:00-16:30 IT' }) === 'dom 11 ott', 'etichetta scadenza leggibile (dom 11 ott)');
  ok(deadlineLabel({ sortDate: '2026-10-28', when: '~fine ott', dateApprox: true }) === '~fine ott', 'scadenza approssimata: testo originale');
  ok(!bh.querySelector('.home-grid__item, .home-count') && !/€1 = ¥|Cambio/.test(bh.textContent), 'home: niente hero, niente griglia Sezioni, niente tasso');

  // --- trasporti ---
  const bt = box('trasporti'); await tr.render(bt, ctx);
  const t = await app.loadData('transport');
  ok(bt.querySelectorAll('.tr-leg').length === t.legs.length, `trasporti: ${t.legs.length} tratte`);
  ok(bt.querySelectorAll('.tr-opt--chosen').length === t.legs.length, 'trasporti: 1 opzione scelta per tratta');
  ok([...bt.querySelectorAll('.tr-opt--chosen')].every((c) => c.querySelectorAll(':scope > p:not(.tr-opt__name):not(.tr-opt__meta):not(.tr-opt__open)').length <= 1), 'trasporti: al massimo una riga di nota sulla card');
  ok([...bt.querySelectorAll('.tr-opt--chosen details > summary')].some((x) => x.textContent === 'Come si prenota e si ritira'), 'trasporti: prenota/pagamento/ritiro in un details');
  const nDates = new Set(t.legs.map((l) => l.date)).size;
  ok(bt.querySelectorAll('.tr-day').length === nDates, `trasporti: tratte raggruppate in ${nDates} date`);
  ok(bt.querySelector('.tr-total')?.textContent.includes('€237'), 'trasporti: totale scelte €237');
  const tabs = [...bt.querySelectorAll('[role=tab]')];
  ok(tabs.length === 4, 'trasporti: 4 tab');
  tabs[1].click(); ok(bt.querySelectorAll('.tr-leg').length === t.transfers.length, `tab Aeroporti: ${t.transfers.length} transfer`);
  ok(!bt.textContent.includes('[object Object]') && !!bt.querySelector('.tr-opt__details dl'), 'aeroporti: details {cost,how,booking,proCon} resi come dl');
  tabs[2].click(); ok(bt.querySelectorAll('.tr-guide').length === t.bookingGuide.length, 'tab Prenotazioni: card guida');
  ok(!!bt.querySelector('.tr-guide a[target=_blank] .sr-only') && !bt.querySelector('.tr-guide .icon'), 'prenotazioni: link esterni senza icona, «nuova scheda» per screen reader');
  ok(!bt.querySelector('.tr-guide.card'), 'prenotazioni: sezioni tipografiche, non card');
  tabs[3].click();
  ok(bt.querySelectorAll('.tr-chk').length === t.checklist.length, 'tab Scadenze: tutte le voci');
  ok(bt.querySelectorAll('.tr-chk--done').length === t.checklist.filter((c) => c.status === 'done').length, 'scadenze: badge fatto');
  ok(bt.querySelectorAll('.section-title').length >= 2, 'scadenze da fare raggruppate per mese');
  ok(!!bt.querySelector('details.tr-done') && bt.querySelectorAll('details.tr-done .tr-chk').length === t.checklist.filter((c) => c.status === 'done').length, 'scadenze fatte ripiegate in "Già fatte"');
  // telefoni: ammessi solo quelli pubblici dei ristoranti nella checklist (scelta exporter); niente IBAN/carte
  ok(!/\bIT\d{2}[A-Z]\d{10}|\b\d{4}[ -]\d{4}[ -]\d{4}[ -]\d{4}\b/.test(JSON.stringify(t)), 'transport.json senza IBAN/numeri di carta');

  // --- alloggi ---
  const ba = box('alloggi'); await al.render(ba, ctx);
  const stays = [...ba.querySelectorAll('.al-stay')];
  ok(stays.length === 6, 'alloggi: 6 basi');
  ok(stays[0].id === 'osaka' && stays[5].id === 'tokyo', 'alloggi: ordine cronologico');
  ok(stays.every((s) => s.querySelector('a.btn[href*="google.com/maps"]')), 'alloggi: bottone Maps su ogni base');
  const photos = (trip.photos || []);
  ok(stays.every((s) => s.querySelector('figure.photo .photo__name')?.textContent && !!s.querySelector('figure.photo img') === photos.includes(s.id)), 'alloggi: slot foto con fallback (immagine solo se elencata in trip.photos)');
  ok(stays.every((s) => s.querySelectorAll('.badge').length <= 1), 'alloggi: al massimo un badge per base');
  const at = [...ba.querySelectorAll('[role=tab]')];
  ok(at.length === 3, 'logistica: 3 sotto-schede');
  const lg = (await app.loadData('lodging')).logistics;
  ok(ba.querySelectorAll('.al-steps > li').length === lg.luggage.steps.length, `bagagli: ${lg.luggage.steps.length} passi numerati`);
  ok(!/Da chiudere/.test(ba.textContent), 'logistica: niente colonna interna "Da chiudere"');
  at[1].click(); ok(ba.querySelectorAll('.al-steps > li').length === lg.day1.length, `giorno 1: ${lg.day1.length} passi`);
  ok(!!ba.querySelector('#al-open-h') === (lg.day1.some((p) => p.todo) || lg.luggage.openQuestions.some((q) => q.status !== 'resolved')), 'alloggi: sezione "Da chiarire" in fondo se ci sono punti aperti');
  ok(stays.every((s) => !/check-(in|out)[^·]*—/.test(s.textContent)), 'alloggi: orari vuoti non mostrati come "—"');
  at[2].click(); ok(ba.textContent.includes('ICOCA'), 'contanti e carte IC');

  // --- luoghi ---
  const st0 = (P) => ({ q: '', cities: [], flags: ['Sì', 'Forse'], sort: 'city', cityOrder: [...new Set(P.map((p) => p.city))] });
  try { localStorage.removeItem('giappone.pages.luoghi'); } catch (e) {}
  const bl = box('luoghi'); await lu.render(bl, ctx);
  const P = (await app.loadData('places')).places;
  const def = P.filter((p) => p.flag === 'Sì' || p.flag === 'Forse' || (!p.flag && (p.dayDates || []).length)).length;
  ok(bl.querySelectorAll('.lu-row').length === def, `luoghi: default Sì+Forse (+ senza flag in agenda) = ${def}`);
  ok(bl.querySelectorAll('details.lu-group').length === new Set(lu.filterPlaces(P, st0(P)).map((p) => p.city)).size, 'luoghi: un gruppo richiudibile per città');
  ok([...bl.querySelectorAll('details.lu-group')].every((g) => Number(g.querySelector('summary .lu-group__count').textContent) === g.querySelectorAll('.lu-row').length), 'luoghi: conteggio nel titolo del gruppo');
  ok(!bl.querySelector('.lu-row .badge'), 'luoghi: niente badge nelle righe (il flag è una parola)');
  ok([...bl.querySelectorAll('.lu-row')].every((r) => r.querySelector('a.btn--icon[aria-label][href*="google.com/maps"]')), 'luoghi: Maps come icona-bottone con aria-label');
  ok(lu.filterPlaces(P, { ...st0(P), flags: [''] }).length === P.filter((p) => !p.flag).length, 'chip Da decidere: tutti i luoghi senza flag');
  const st = { q: '', cities: [], flags: ['Sì', 'Forse'], sort: 'city', cityOrder: [...new Set(P.map((p) => p.city))] };
  ok(lu.filterPlaces(P, st).length === def, 'filterPlaces: default');
  ok(lu.filterPlaces(P, { ...st, q: 'fushimi inari', flags: ['Sì', 'Forse', 'No', 'Futuro', ''] }).some((p) => p.id === 'fushimi-inari-taisha'), 'ricerca multi-termine');
  ok(lu.filterPlaces(P, { ...st, q: 'dotonbori' }).length > 0, 'ricerca senza diacritici (Dōtonbori)');
  ok(lu.filterPlaces(P, { ...st, cities: ['Kobe'] }).every((p) => p.city === 'Kobe'), 'filtro città');
  const byName = lu.filterPlaces(P, { ...st, sort: 'name' });
  ok(byName[0].name.localeCompare(byName[1].name, 'it') <= 0, 'ordinamento per nome');
  ok(bl.querySelectorAll('.lu-days a.chip[href*="giorno.html?d=2026-11-"]').length > 0, 'chip giorni → giorno.html');
  const geo = P.some((p) => p.lat != null);
  ok(!!bl.querySelector('a[href*="maps/dir/?api=1&destination="]') === geo, geo ? 'Indicazioni se ci sono lat/lon' : 'nessuna Indicazioni senza lat/lon (dati reali)');
  const kobe = bl.querySelector('[data-city="Kobe"]'); kobe.click();
  ok([...bl.querySelectorAll('details.lu-group')].map((g) => g.dataset.group).join() === 'Kobe' && bl.querySelector('details.lu-group').open, 'chip Kobe filtra la lista (gruppo aperto)');
  ok((JSON.parse(localStorage.getItem('giappone.pages.luoghi') || '{}').cities || []).includes('Kobe'), 'luoghi: filtri ricordati in localStorage');
  ok(kobe.getAttribute('aria-pressed') === 'true', 'chip attivo con aria-pressed');
  bl.querySelector('[data-city=""]').click();
  try { localStorage.removeItem('giappone.pages.luoghi'); } catch (e) {}
  const evil = box('xss');
  await lu.render(evil, { trip, loadData: async () => ({ places: [{ id: 'x', name: '<img src=x onerror=alert(1)>', city: '"><b>', flag: 'Sì', mapsQuery: 'x' }] }) });
  ok(!evil.querySelector('img, b'), 'luoghi: dati malevoli escapati');

  // --- budget ---
  const bb = box('budget'); await bu.render(bb, ctx);
  const b = await app.loadData('budget');
  ok(bb.querySelectorAll('.bu-table')[0].querySelectorAll('tbody tr').length === b.perPerson.categories.length, 'budget: righe categorie');
  ok(bb.querySelectorAll('.bu-est').length === b.perPerson.categories.filter((c) => c.estimate).length + b.perPerson.common.filter((c) => c.estimate).length, 'budget: «stima» come parola');
  ok(!bb.querySelector('.card'), 'budget: niente card');
  ok(bb.textContent.includes('€2.765,61') && bb.textContent.includes('€11.062,44'), 'budget: totali persona e gruppo');
  ok(bb.querySelectorAll('.bu-bar__fill').length > 0, 'budget: barre proporzionali');
  const tf = [...bb.querySelectorAll('.bu-table tfoot td strong')].map((x) => x.textContent);
  const eurs = (r) => '€' + r.reduce((a, c) => a + c.eur, 0).toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  ok(tf[0] === eurs(b.perPerson.categories), 'budget: totale della tabella = somma delle sue righe');
  const w = [...bb.querySelectorAll('.bu-bar__fill')].map((x) => parseInt(x.style.getPropertyValue('--w')));
  ok(Math.max(...w) === 100 && w.filter((x) => x === 100).length === 1, 'budget: una sola scala per tutte le barre');

  // --- testi: niente gergo del dossier né valori rotti nel render ---
  const all = [bh, bt, ba, bl, bb].map((x) => x.textContent).join(' ');
  ok(!/📎|🗓|\bdossier\b|CHOICES|\bv2\d\b|undefined|\bnull\b|\[object/.test(all), 'render: niente riferimenti al dossier, "null", "undefined", "[object"');
  ok(!/\(verificat|Verificato su|\([^()]*\(/.test(all), 'render: niente «(verificato)» né parentesi annidate');

  const sum = document.createElement('p');
  sum.className = fails ? 't-ko' : 't-ok';
  sum.textContent = fails ? `${fails} test falliti` : 'Tutti i test OK';
  out.before(sum);
  document.title = (fails ? 'KO ' : 'OK ') + document.title;
  window.__TEST_RESULT__ = { fails, total: out.children.length };
</script>
</body>
</html>
